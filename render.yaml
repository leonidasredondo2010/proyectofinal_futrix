services:
  - type: web
    name: proyectofinal_futrix
    runtime: node
    plan: free
    rootDir: Proyecto final
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://leonidasredondo2010.github.io
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
